[project]
name = "structural-exhaustion"
version = "0.1.0"
description = "Lean proof framework with Flask and React documentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "jsonschema>=4.22,<5",
  "pydantic>=2.11,<3",
  "pytest>=8,<10",
]

[project.optional-dependencies]
fashion-mnist = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "xgboost>=3,<4",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
